<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ Lyric Player ♡</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0b;
            color: #ffffff;
            font-family: "Courier New", monospace;
        }
        .window {
            width: 90%;
            max-width: 650px;
            background: #111111;
            border: 1px solid #444;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(255,255,255,0.08);
        }
        /* Top bar */
        .top {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            background: #191919;
            border-bottom: 1px solid #333;
        }
        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #777;
            margin-right: 7px;
        }
        .title {
            margin-left: 10px;
            font-size: 13px;
            color: #aaa;
        }
        /* Lyrics */
        .screen {
            min-height: 300px;
            padding: 45px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #lyrics {
            font-size: 21px;
            line-height: 1.7;
            max-width: 550px;
            white-space: pre-wrap;
        }
        /* Typing cursor */
        #lyrics::after {
            content: "▌";
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        /* Button */
        .bottom {
            padding: 15px;
            text-align: center;
            border-top: 1px solid #333;
        }
        button {
            padding: 9px 25px;
            background: #eeeeee;
            color: #111;
            border: none;
            border-radius: 7px;
            font-family: "Courier New", monospace;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.75;
        }
        .hint {
            margin-top: 10px;
            color: #666;
            font-size: 11px;
        }
    </style>
</head>
<body>
<div class="window">
    <!-- Window bar -->
    <div class="top">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="title">
            lyric-player.exe
        </div>
    </div>
    <!-- Lyrics -->
    <div class="screen">
        <div id="lyrics">
            Press PLAY ♫
        </div>
    </div>
    <!-- Button -->
    <div class="bottom">
        <button onclick="startLyrics()">
            PLAY ♫
        </button>
        <div class="hint">
            typewriter mode
        </div>
    </div>
</div>
<script>
    // ==========================================
    // ✨ PUT YOUR OWN TEXT HERE
    // ==========================================
    const lyrics = [
        "Aminadong makasarili't mapagdamot",
        "oh, sadyang naging ganito na lang sa'yo",
        "Madaling pagbuksan pagka kakatok",
        "Natatakot na baka ika'y mapalayo",
        "Sana ako'y pakinggan",
        "Natural na sa 'kin ang maging makabasag-pinggan",
        "oh, masakit na sa iba pa manggagaling",
        "Para sa 'kin, 'di kayo bagay na tingnan",
    ];
    // ==========================================
    // ⚙️ SETTINGS
    // ==========================================
    const typingSpeed = 65;
    const pauseBetweenLines = 1200;
    let line = 0;
    // ==========================================
    // 🎹 START
    // ==========================================
    function startLyrics() {
        line = 0;
        document.getElementById("lyrics").textContent = "";
        typeLine();
    }
    // ==========================================
    // ⌨️ TYPE EACH LINE
    // ==========================================
    function typeLine() {
        if (line >= lyrics.length) {
            return;
        }
        const text = lyrics[line];
        let character = 0;
        const lyricBox =
            document.getElementById("lyrics");
        lyricBox.textContent = "";
        function typeCharacter() {
            if (character < text.length) {
                lyricBox.textContent +=
                    text.charAt(character);
                character++;
                setTimeout(
                    typeCharacter,
                    typingSpeed
                );
            } else {
                line++;
                setTimeout(
                    typeLine,
                    pauseBetweenLines
                );
            }
        }
        typeCharacter();
    }
</script>
</body>
</html>
