<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ Lyric Player ♡</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: "Courier New", monospace;
            color: white;
        }
        .player {
            width: 90%;
            max-width: 600px;
            padding: 35px;
            background: rgba(25, 25, 25, 0.95);
            border: 1px solid #555;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,255,255,0.08);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 30px;
        }
        #lyric {
            min-height: 80px;
            font-size: 20px;
            line-height: 1.6;
            margin: 25px 0;
        }
        button {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: white;
            color: black;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.8;
        }
        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
<div class="player">
    <h1>♡ NOW PLAYING ♡</h1>
    <div id="lyric">
        Press Play ♫
    </div>
    <button onclick="startSong()">PLAY</button>
    <p class="note">
        ♪ lyric player
    </p>
</div>
<script>
    // ==================================
    // YOUR TEXT
    // ==================================
    const lyrics = [
        {
            text: "Your first line goes here...",
            time: 0
        },
        {
            text: "Your second line goes here...",
            time: 4
        },
        {
            text: "Your third line goes here...",
            time: 8
        },
        {
            text: "Your fourth line goes here...",
            time: 12
        },
        {
            text: "Your fifth line goes here...",
            time: 16
        }
    ];
    // ==================================
    // PLAYER
    // ==================================
    let currentLine = 0;
    let startTime;
    function startSong() {
        currentLine = 0;
        startTime = Date.now();
        document.getElementById("lyric").textContent =
            lyrics[0].text;
        showNextLyric();
    }
    function showNextLyric() {
        if (currentLine >= lyrics.length - 1) {
            return;
        }
        currentLine++;
        const nextTime = lyrics[currentLine].time * 1000;
        setTimeout(() => {
            document.getElementById("lyric").textContent =
                lyrics[currentLine].text;
            showNextLyric();
        }, nextTime - (Date.now() - startTime));
    }
</script>
</body>
</html>
